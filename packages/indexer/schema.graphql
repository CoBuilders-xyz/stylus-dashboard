"A Stylus contract that has been activated via ArbWasm"
type StylusContract @entity {
  id: ID!
  "Wallet address that sent the activation transaction"
  deployer: String! @index
  "Keccak256 hash of the WASM bytecode"
  codehash: String! @index
  "Hash of the compiled native module"
  moduleHash: String!
  "Stylus version the program was compiled against"
  version: Int!
  "Data fee paid for activation (in wei)"
  dataFee: BigInt!
  "Block timestamp when activated"
  activatedAt: Int!
  "Block number when activated"
  activatedBlock: Int!
  "Chain ID where this contract lives"
  chainId: Int!
  "Whether the contract is currently in the WASM cache"
  isCached: Boolean!
  "Timestamp of the most recent keepalive/reactivation"
  lastKeepalive: Int
  "Estimated expiration timestamp (activatedAt + 365 days by default)"
  expiresAt: Int
}

"Lookup from codehash to contract, for events that only carry a codehash"
type CodehashIndex @entity {
  "The program's codehash"
  id: ID!
  "Address of the StylusContract with this codehash"
  contractId: String! @index
}

"A lifetime extension (keepalive) event for a Stylus program"
type LifetimeExtension @entity {
  id: ID!
  codehash: String! @index
  dataFee: BigInt!
  timestamp: Int!
  blockNumber: Int!
}

"A cache update event from ArbWasmCache"
type CacheEvent @entity {
  id: ID!
  manager: String! @index
  codehash: String! @index
  "True if program was cached, false if evicted"
  cached: Boolean!
  timestamp: Int!
  blockNumber: Int!
}

"An EVM (non-Stylus) contract deployment, for the EVM vs Stylus comparison"
type EvmDeployment @entity {
  "Address of the deployed contract"
  id: ID!
  "Wallet address that sent the transaction the contract was created in"
  deployer: String! @index
  "Block number of the deployment"
  blockNumber: Int!
  "Block timestamp of the deployment"
  timestamp: Int!
  "Chain ID where the contract was deployed"
  chainId: Int!
}

"A wallet address that has activated at least one Stylus program"
type DeployerRegistry @entity {
  "Deployer wallet address"
  id: ID!
  "What this address has deployed so far: stylus, evm, or both. Both sides record the wallet that sent the transaction, not the contract that ran the creation."
  deployerType: String! @index
  "Stylus contracts this address has activated for the first time. Keepalives and re-activations of an existing program do not count."
  stylusContractCount: Int! @index
  "Timestamp of its first Stylus activation, unset for an address only known from EVM"
  firstStylusAt: Int @index
  "Timestamp of its most recent Stylus activation"
  lastStylusAt: Int
  "How many distinct 7-day windows since the epoch it has activated in"
  stylusWeeks: Int!
  "The most recent of those windows, so stylusWeeks only advances once per window"
  lastStylusWeek: Int
}

"Singleton (id: 'global') with ecosystem-wide running totals"
type GlobalStats @entity {
  id: ID!
  "Cumulative count of unique deployer addresses"
  cumulativeDeployers: Int!
  "Cumulative count of EVM contract deployments"
  totalEvmContracts: Int!
  "Deployers holding more than one Stylus contract"
  repeatStylusDeployers: Int!
  "Deployers that have activated in more than one 7-day window"
  retainedStylusDeployers: Int!
}

"Aggregated daily statistics for Stylus ecosystem"
type DailyStats @entity {
  "Format: YYYY-MM-DD"
  id: ID!
  "Unix timestamp for the start of this day (00:00 UTC)"
  date: Int!
  "Number of new Stylus activations on this day"
  stylusActivations: Int!
  "Number of reactivations/keepalives on this day"
  stylusReactivations: Int!
  "Number of first-time deployer addresses on this day. Stylus only, same as uniqueStylusDeployers"
  uniqueDeployers: Int!
  "Number of addresses deploying their first Stylus contract on this day"
  uniqueStylusDeployers: Int!
  "Number of addresses deploying their first EVM contract on this day"
  uniqueEvmDeployers: Int!
  "Cumulative count of unique deployers up to this day"
  cumulativeDeployers: Int!
  "Cumulative total of Stylus contracts up to this day"
  totalStylusContracts: Int!
  "Number of EVM contract deployments on this day"
  evmDeployments: Int!
  "Cumulative total of EVM contracts up to this day"
  totalEvmContracts: Int!
  "Number of cache events on this day"
  cacheEvents: Int!
}
