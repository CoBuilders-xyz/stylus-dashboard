# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# Arbitrum One mainnet configuration (uses HyperSync for fast historical sync)
# Requires: ENVIO_API_TOKEN environment variable
# Get your free token at: https://envio.dev/app/api-tokens
#
# Usage: cp config.arbitrum-one.yaml config.yaml && envio dev -r

name: stylus-dashboard-indexer
description: Indexes Stylus ecosystem metrics on Arbitrum One

field_selection:
  transaction_fields:
    - from
    - hash

contracts:
  - name: ArbWasm
    abi_file_path: ./abis/ArbWasm.json
    events:
      - event: "ProgramActivated(bytes32 indexed codehash, bytes32 moduleHash, address program, uint256 dataFee, uint16 version)"
      - event: "ProgramLifetimeExtended(bytes32 indexed codehash, uint256 dataFee)"

  - name: ArbWasmCache
    abi_file_path: ./abis/ArbWasmCache.json
    events:
      - event: "UpdateProgramCache(address indexed manager, bytes32 indexed codehash, bool cached)"

chains:
  - id: 42161 # Arbitrum One (HyperSync supported natively)
    start_block: 240000000 # ~1.5M blocks back: events sync first, then traces catch up at realtime
    contracts:
      - name: ArbWasm
        address: "0x0000000000000000000000000000000000000071"
      - name: ArbWasmCache
        address: "0x0000000000000000000000000000000000000072"
