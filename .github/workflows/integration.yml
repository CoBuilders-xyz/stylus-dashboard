name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devnode-smoke:
    name: Devnode Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start Nitro devnode
        run: ./scripts/devnode.sh --detach

      - name: Deploy test contracts (seed)
        run: pnpm seed:ci > /tmp/seed-output.json

      - name: Verify deployments
        run: |
          CONTRACT_COUNT=$(jq '.contracts | length' /tmp/seed-output.json)
          DEPLOYER_COUNT=$(jq '.deployerCount' /tmp/seed-output.json)

          echo "Deployed $CONTRACT_COUNT contracts from $DEPLOYER_COUNT deployers"

          if [[ "$CONTRACT_COUNT" -lt 5 ]]; then
            echo "ERROR: Expected at least 5 contracts, got $CONTRACT_COUNT"
            exit 1
          fi

          echo "Verifying ArbWasm precompile..."
          STYLUS_VERSION=$(cast call 0x0000000000000000000000000000000000000071 \
            "stylusVersion()(uint16)" --rpc-url http://localhost:8547)
          echo "Stylus version: $STYLUS_VERSION"

          if [[ -z "$STYLUS_VERSION" || "$STYLUS_VERSION" == "0" ]]; then
            echo "ERROR: ArbWasm precompile not responding"
            exit 1
          fi

          echo "All smoke checks passed"

      - name: Stop devnode
        if: always()
        run: docker stop nitro-devnode 2>/dev/null || true
